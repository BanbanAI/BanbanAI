name: Release

# 触发方式二选一：
#   1. push 一个 v2.0.0 这样的 tag
#   2. 手动 run，填一个已存在的 tag
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag，例如 v2.0.0（必须与 package.json 的 version 一致）"
        required: true
        type: string

permissions:
  contents: write

env:
  PRODUCT: banban-client
  ARTIFACT_DIR: dist/app/main/zh-CN/package

jobs:
  prepare:
    name: 生成 release 正文
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      base: ${{ steps.meta.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - id: meta
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "base=${PRODUCT}-${TAG#v}" >> "$GITHUB_OUTPUT"

      # 产物名里嵌了版本号，tag 和 package.json 不一致会直接产生死链
      - name: 校验 tag 与 package.json version 一致
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "tag $TAG 与 package.json version $VERSION 不一致" >&2
            exit 1
          fi

      - name: 拼装 Downloads 表格与 Release Notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          node tools/release/compose-release-body.js \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --out release-body.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-body
          path: release-body.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: 构建 ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          # ──────────────────────────────────────────────────────────────
          # macOS 出的是未签名/未公证的包：构建侧已做降级
          # （builder/electron-builder.config.ts 检测不到 Developer ID 证书
          # 就跳过签名、公证），不需要任何 secrets 即可构建成功。
          # 以后要做 CI 签名+公证：配好「导入签名证书」「配置公证凭据」
          # 两个 step 的 secrets 并取消其注释即可。
          # ──────────────────────────────────────────────────────────────
          - os: macos-15        # Apple silicon
            platform: mac
            arch: arm64
          - os: macos-15-intel  # Intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: 安装 rpm 打包工具
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: yarn install --frozen-lockfile

      # ──────────────────────────────────────────────────────────────────
      # macOS 签名证书 + 公证凭据（可选）：不启用时 mac 出未签名包。
      # 要出签名+公证的正式包时，取消下面两个 step 的注释并配好这些 secrets。
      #
      # 一次性准备（做完把值填进 Settings → Secrets and variables → Actions）：
      #   MAC_CERT_P12        本机「钥匙串访问」导出 Developer ID Application 证书为
      #                       .p12，再 base64 -i cert.p12 编码后的内容
      #   MAC_CERT_PASSWORD   导出 .p12 时设的密码
      #   KEYCHAIN_PASSWORD   随便生成一串，仅用于 runner 上的临时 keychain
      #   APPLE_API_KEY       App Store Connect → Users and Access → Integrations →
      #                       Team Keys 生成的 .p8，base64 编码后的内容（只能下载一次）
      #   APPLE_API_KEY_ID / APPLE_API_ISSUER   同上页面的两个 ID
      #
      # runner 每次都是全新的机器，凭据只能每次现场灌进去，没法"提前设置好"。
      # ──────────────────────────────────────────────────────────────────
      # - name: 导入签名证书
      #   if: matrix.platform == 'mac'
      #   env:
      #     CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      #     CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      #     KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      #   run: |
      #     KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
      #     echo "$CERT_P12" | openssl base64 -d > "$RUNNER_TEMP/cert.p12"
      #
      #     security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
      #     security set-keychain-settings -lut 3600 "$KEYCHAIN"
      #     security default-keychain -s "$KEYCHAIN"
      #     security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
      #
      #     security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
      #       -P "$CERT_PASSWORD" -T /usr/bin/codesign
      #
      #     # 少了这行，codesign 会去弹密钥授权对话框然后卡到超时
      #     security set-key-partition-list -S apple-tool:,apple:,codesign: \
      #       -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
      #
      #     security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
      #     rm -f "$RUNNER_TEMP/cert.p12"
      #
      # - name: 配置公证凭据
      #   if: matrix.platform == 'mac'
      #   env:
      #     APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      #     APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      #     APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      #   run: |
      #     # 建一个和本机同名的 profile，electron-builder.config.ts 里的
      #     # keychainProfile: "NOTARY_BANBAN" 就不用改任何代码
      #     echo "$APPLE_API_KEY" | openssl base64 -d > "$RUNNER_TEMP/AuthKey.p8"
      #     xcrun notarytool store-credentials NOTARY_BANBAN \
      #       --key "$RUNNER_TEMP/AuthKey.p8" \
      #       --key-id "$APPLE_API_KEY_ID" \
      #       --issuer "$APPLE_API_ISSUER"
      #     rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: 打包
        run: yarn build

      - name: 打包（无桌面版）
        if: matrix.platform == 'linux'
        run: yarn build:server

      - name: 压缩无桌面版产物（传工件给 docker/nas 复用）
        if: matrix.platform == 'linux'
        shell: bash
        run: tar -czf server-build.tar.gz --exclude='*.zip' -C dist/server/main/zh-CN app

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: server-raw-${{ matrix.arch }}
          path: server-build.tar.gz
          if-no-files-found: error
          retention-days: 7

      # electron-builder 和无桌面版（pkg）产出的文件名带中文且不含架构，
      # 这里统一改成 ASCII 稳定名，Downloads 表格里的链接才成立。
      - name: 归一化产物名
        shell: bash
        env:
          BASE: ${{ needs.prepare.outputs.base }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          SERVER_DIR: dist/server/main/zh-CN/app
        run: |
          set -euo pipefail
          mkdir -p upload
          found=0

          rename() {
            local ext="$1" target="$2"
            # 排除 win-unpacked / linux-unpacked / mac-* 里的可执行文件
            while IFS= read -r file; do
              cp -f "$file" "upload/$target"
              echo "$(basename "$file") -> $target"
              found=1
            done < <(find "$ARTIFACT_DIR" -type f -name "*.$ext" -not -path "*unpacked*" -not -path "*mac-*")
          }

          case "$PLATFORM" in
            win)   rename exe "$BASE-win-$ARCH-setup.exe" ;;
            mac)   rename dmg "$BASE-mac-$ARCH.dmg"; rename zip "$BASE-mac-$ARCH.zip" ;;
            linux) rename AppImage "$BASE-linux-$ARCH.AppImage"
                   rename deb "$BASE-linux-$ARCH.deb"
                   rename rpm "$BASE-linux-$ARCH.rpm"
                   # 无桌面版 zip 在 server 构建目录，不在 package 目录
                   server_zips=("$SERVER_DIR"/*.zip)
                   if [ ! -e "${server_zips[0]}" ]; then
                     echo "没找到无桌面版 zip，检查 $SERVER_DIR（先跑 yarn build:server）" >&2
                     exit 1
                   fi
                   cp -f "${server_zips[0]}" "upload/$BASE-linux-$ARCH-server.zip"
                   echo "$(basename "${server_zips[0]}") -> $BASE-linux-$ARCH-server.zip"
                   found=1 ;;
          esac

          if [ "$found" -eq 0 ]; then
            echo "没有找到任何安装包，检查 $ARTIFACT_DIR" >&2
            exit 1
          fi
          ls -la upload

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: upload/*
          if-no-files-found: error
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────
  # docker / nas 打包：不重复编译 server——直接复用 build 里两条 linux 腿产出的
  # 无桌面版产物（server-raw-x64 / server-raw-arm64 工件），只跑各自的打包命令。
  # x64 的两条腿跑在 x86 runner 上，arm64 的两条腿跑在 ARM runner 上（leveldown
  # 等原生模块只能在 ARM 机器上编出来）；群晖封包分别用 v1000nk / rtd1619b 的
  # pkgscripts-ng chroot。
  # 代价：这四条腿要等整个 build job（含 windows/mac 腿）结束才开始。
  # ────────────────────────────────────────────────────────────────────
  docker-x64:
    name: 打包 docker-x64
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      # 复用 build 里 linux-x64 腿编好的无桌面版产物
      - name: 下载无桌面版产物
        uses: actions/download-artifact@v4
        with:
          name: server-raw-x64
          path: dist/server/main/zh-CN

      - name: 解包到 dist/server
        shell: bash
        run: |
          set -euo pipefail
          cd dist/server/main/zh-CN
          tar -xzf server-build.tar.gz
          rm server-build.tar.gz

      - name: 构建离线镜像
        run: yarn build:docker:server --arch x64

      - name: 归一化产物名
        shell: bash
        env:
          BASE: ${{ needs.prepare.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p upload
          cp dist/docker/server/banban-*.tar.gz "upload/$BASE-docker-x64.tar.gz"
          ls -la upload

      - uses: actions/upload-artifact@v4
        with:
          name: dist-docker-x64
          path: upload/*
          if-no-files-found: error
          retention-days: 7

  docker-arm64:
    name: 打包 docker-arm64
    needs: [prepare, build]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      # 复用 build 里 linux-arm64 腿编好的无桌面版产物
      - name: 下载无桌面版产物
        uses: actions/download-artifact@v4
        with:
          name: server-raw-arm64
          path: dist/server/main/zh-CN

      - name: 解包到 dist/server
        shell: bash
        run: |
          set -euo pipefail
          cd dist/server/main/zh-CN
          tar -xzf server-build.tar.gz
          rm server-build.tar.gz

      # ARM runner 上原生构建，docker build 默认就出 linux/arm64 镜像
      - name: 构建离线镜像
        run: yarn build:docker:server --arch arm64

      - name: 归一化产物名
        shell: bash
        env:
          BASE: ${{ needs.prepare.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p upload
          cp dist/docker/server/banban-*.tar.gz "upload/$BASE-docker-arm64.tar.gz"
          ls -la upload

      - uses: actions/upload-artifact@v4
        with:
          name: dist-docker-arm64
          path: upload/*
          if-no-files-found: error
          retention-days: 7

  nas-x64:
    name: 打包 nas-x64
    needs: [prepare, build]
    # pkgscripts-ng 官方只保证 Ubuntu ≤ 22.04，别升 24.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: 安装群晖打包环境依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap

      # 飞牛 fpk 需要官方 fnpack；下载地址放仓库变量 FNPACK_URL
      - name: 安装 fnpack（飞牛打包工具）
        env:
          FNPACK_URL: ${{ vars.FNPACK_URL }}
        run: |
          if [ -z "$FNPACK_URL" ]; then
            echo "未配置仓库变量 FNPACK_URL（fnpack linux-amd64 可执行文件直链）" >&2
            exit 1
          fi
          curl -fsSL "$FNPACK_URL" -o "$HOME/fnpack"
          chmod +x "$HOME/fnpack"
          echo "FNPACK_BIN=$HOME/fnpack" >> "$GITHUB_ENV"

      - name: 准备 pkgscripts-ng（部署 v1000nk chroot，会下载 Synology 工具链，较慢）
        run: |
          git clone https://github.com/SynologyOpenSource/pkgscripts-ng.git "$HOME/pkgscripts-ng"
          cd "$HOME/pkgscripts-ng"
          git checkout DSM7.3
          sudo ./EnvDeploy -v 7.3 -p v1000nk
          echo "PKGSCRIPTS_NG_DIR=$HOME/pkgscripts-ng" >> "$GITHUB_ENV"

      - run: yarn install --frozen-lockfile

      # 复用 build 里 linux-x64 腿编好的无桌面版产物
      - name: 下载无桌面版产物
        uses: actions/download-artifact@v4
        with:
          name: server-raw-x64
          path: dist/server/main/zh-CN

      - name: 解包到 dist/server
        shell: bash
        run: |
          set -euo pipefail
          cd dist/server/main/zh-CN
          tar -xzf server-build.tar.gz
          rm server-build.tar.gz

      - name: 生成 NAS 包（飞牛 fpk + 群晖工程骨架）
        run: yarn build:nas:x64

      # 与本地一致：进 synology 工程目录跑官方封包（PKGSCRIPTS_NG_DIR 已就绪，可省第一个参数）
      - name: 群晖正式封包（v1000nk，产出 x64 通用包）
        working-directory: dist/nas/synology/main/zh-CN/x64
        run: bash build-on-linux.sh v1000nk 7.3

      - name: 归一化产物名
        shell: bash
        env:
          BASE: ${{ needs.prepare.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p upload
          cp dist/nas/fnos/main/zh-CN/x64/*.fpk "upload/$BASE-fnos-x64.fpk"
          cp dist/nas/synology/main/zh-CN/x64/*.spk "upload/$BASE-synology-x64.spk"
          ls -la upload

      - uses: actions/upload-artifact@v4
        with:
          name: dist-nas-x64
          path: upload/*
          if-no-files-found: error
          retention-days: 7

  nas-arm64:
    name: 打包 nas-arm64
    needs: [prepare, build]
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: 安装群晖打包环境依赖 + qemu
        # fnpack 官方只发 amd64 版（静态链接），ARM 机器上靠 qemu 模拟执行；
        # 已用 arm64 Ubuntu 22.04 容器实测：包内有 qemu-x86_64-static，amd64 fnpack 能正常跑
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static binfmt-support
          # 显式注册一次兜底（postinst 正常已注册，重复执行无副作用）
          sudo update-binfmts --enable qemu-x86_64 2>/dev/null || true
          test -f /proc/sys/fs/binfmt_misc/qemu-x86_64 && echo "qemu-x86_64 binfmt 已注册" || echo "警告：qemu-x86_64 binfmt 未注册，fnpack 可能执行失败"

      # 飞牛 fpk 需要官方 fnpack：官方只有 amd64 版，这里下载的也是 amd64 版，靠上面的 qemu 跑
      - name: 安装 fnpack（飞牛打包工具）
        env:
          FNPACK_URL: ${{ vars.FNPACK_URL }}
        run: |
          if [ -z "$FNPACK_URL" ]; then
            echo "未配置仓库变量 FNPACK_URL（fnpack linux-amd64 可执行文件直链）" >&2
            exit 1
          fi
          curl -fsSL "$FNPACK_URL" -o "$HOME/fnpack"
          chmod +x "$HOME/fnpack"
          echo "FNPACK_BIN=$HOME/fnpack" >> "$GITHUB_ENV"

      - name: 准备 pkgscripts-ng（部署 rtd1619b chroot，会下载 Synology 工具链，较慢）
        run: |
          git clone https://github.com/SynologyOpenSource/pkgscripts-ng.git "$HOME/pkgscripts-ng"
          cd "$HOME/pkgscripts-ng"
          git checkout DSM7.3
          sudo ./EnvDeploy -v 7.3 -p rtd1619b
          echo "PKGSCRIPTS_NG_DIR=$HOME/pkgscripts-ng" >> "$GITHUB_ENV"

      - run: yarn install --frozen-lockfile

      # 复用 build 里 linux-arm64 腿编好的无桌面版产物
      - name: 下载无桌面版产物
        uses: actions/download-artifact@v4
        with:
          name: server-raw-arm64
          path: dist/server/main/zh-CN

      - name: 解包到 dist/server
        shell: bash
        run: |
          set -euo pipefail
          cd dist/server/main/zh-CN
          tar -xzf server-build.tar.gz
          rm server-build.tar.gz

      - name: 生成 NAS 包（飞牛 fpk + 群晖工程骨架）
        run: yarn build:nas:arm64

      - name: 群晖正式封包（rtd1619b，产出 ARM64 通用包）
        working-directory: dist/nas/synology/main/zh-CN/arm64
        run: bash build-on-linux.sh rtd1619b 7.3

      - name: 归一化产物名
        shell: bash
        env:
          BASE: ${{ needs.prepare.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p upload
          cp dist/nas/fnos/main/zh-CN/arm64/*.fpk "upload/$BASE-fnos-arm64.fpk"
          cp dist/nas/synology/main/zh-CN/arm64/*.spk "upload/$BASE-synology-arm64.spk"
          ls -la upload

      - uses: actions/upload-artifact@v4
        with:
          name: dist-nas-arm64
          path: upload/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 建 draft release
    needs: [prepare, build, docker-x64, docker-arm64, nas-x64, nas-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 draft 并上传全部安装包
        id: draft
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          commit: ${{ github.sha }}
          bodyFile: artifacts/release-body/release-body.md
          artifacts: "artifacts/dist-*/*"
          draft: true
          makeLatest: false
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # 产物上传完再把 GitHub 生成的 What's Changed 追加进正文。
      # draft 阶段正文里暂时只有 Downloads + Release Notes。
      - name: 追加 What's Changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail

          # 发布分支都是从 main 切出来的，GitHub 无法按祖先关系推断上一个 tag
          PREVIOUS_TAG="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -r --arg tag "$TAG" \
              '[.[][] | select(.draft | not) | select(.tag_name != $tag)] | sort_by(.published_at) | (last | .tag_name) // empty')"

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "没有已发布的版本可以对比，跳过 What's Changed"
            exit 0
          fi

          echo "对比 $PREVIOUS_TAG..$TAG"
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f previous_tag_name="$PREVIOUS_TAG" \
            --jq '.body' > "$RUNNER_TEMP/generated-notes.md"

          node tools/release/compose-release-body.js \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --changes "$RUNNER_TEMP/generated-notes.md" \
            --out "$RUNNER_TEMP/release-body.md"

          # PATCH 时省略 tag_name 会把 draft 重置成 untagged-<sha>，所以显式带上
          jq -Rs --arg tag "$TAG" '{ tag_name: $tag, body: . }' < "$RUNNER_TEMP/release-body.md" \
            > "$RUNNER_TEMP/release-body.json"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --input "$RUNNER_TEMP/release-body.json" > /dev/null

          echo "draft 已就绪（macOS 为未签名包），确认后手动 Publish"
